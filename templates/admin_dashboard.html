{% extends "base.html" %}
{% block content %}
<div class="d-flex justify-content-between align-items-center mb-3">
  <h3 class="mb-0">الرسائل</h3>
  <a href="{{ url_for('admin_logout') }}" class="btn btn-sm btn-outline-secondary">خروج</a>
</div>

{% for r in rows %}
  <div class="confession-card">
    <p class="mb-2">{{ r.message }}</p>
    <div class="d-flex justify-content-between">
      <span class="phone">📱 {{ r.phone }}</span>
      <span class="time">{{ r.created_at.strftime('%Y-%m-%d %H:%M') }}</span>
    </div>
  </div>
{% else %}
  <p class="text-muted text-center">لا توجد رسائل بعد.</p>
{% endfor %}
{% endblock %}
